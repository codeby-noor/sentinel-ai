name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build-test-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/api/package-lock.json
      - name: Install API deps
        working-directory: apps/api
        run: npm ci
      - name: Prisma generate
        working-directory: apps/api
        run: npx prisma generate
      - name: Lint/typecheck
        working-directory: apps/api
        run: npm run typecheck
      - name: Unit + integration tests
        working-directory: apps/api
        run: npm test -- --coverage
        env:
          JWT_SECRET: ci-test-secret-min-32-chars-long-xxxx
          DATABASE_URL: postgresql://sentinel:sentinel@localhost:5432/sentinel?schema=public

  build-test-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install web deps (no workspace lockfile; versions are pinned in apps/web/package.json)
        working-directory: apps/web
        run: npm install --no-audit --no-fund
      - name: Typecheck
        working-directory: apps/web
        run: npm run typecheck
      - name: Unit tests
        working-directory: apps/web
        run: npm test -- --watchAll=false
        env:
          CI: true
      - name: Production build
        working-directory: apps/web
        run: npm run build
        env:
          NEXT_PUBLIC_API_BASE_URL: http://localhost:4000

  e2e:
    runs-on: ubuntu-latest
    needs: [build-test-api, build-test-web]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install web deps for E2E
        working-directory: apps/web
        run: npm install --no-audit --no-fund
      - name: Install Playwright
        working-directory: apps/web
        run: npx playwright install --with-deps chromium
      - name: Run E2E (static)
        working-directory: apps/web
        run: npm run test:e2e
